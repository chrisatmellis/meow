name: testflight

# Manual only, deliberately.
#
# This spends macOS runner minutes (billed at 10x on a private repo) and pushes a
# build to real testers, neither of which should happen just because someone
# pushed a commit. Run it from the Actions tab when you want a build to go out.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Authentication key
        env:
          S_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          S_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Repository secrets win where they exist; ci/ is the fallback. Moving
          # to secrets later is then just setting them — see ci/README.md.
          . ci/credentials.env
          KEY_ID="${S_KEY_ID:-$ASC_KEY_ID}"
          echo "KEY_ID=$KEY_ID"                              >> "$GITHUB_ENV"
          echo "ISSUER_ID=${S_ISSUER_ID:-$ASC_ISSUER_ID}"    >> "$GITHUB_ENV"
          echo "TEAM_ID=${S_TEAM_ID:-$ASC_TEAM_ID}"          >> "$GITHUB_ENV"

          mkdir -p ~/private_keys
          if [ -n "$S_KEY_P8" ]; then
            printf '%s\n' "$S_KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
            echo "using repository secrets"
          else
            cp "$ASC_KEY_FILE" ~/private_keys/AuthKey_$KEY_ID.p8
            echo "using committed credentials in ci/"
          fi
          # A .p8 that arrived mangled fails much later, with an error that says
          # nothing about the key. Catch it here instead.
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_$KEY_ID.p8 \
            || { echo "::error::the .p8 is not a PEM private key."; exit 1; }

      - name: Archive
        run: |
          set -o pipefail
          # Archive without signing, and let the export step sign it.
          #
          # Signing here instead fails outright on an account with no registered
          # devices: archiving asks for an *iOS App Development* profile, and
          # development profiles are built from a device list. The account has
          # none and does not need any — the build is going to TestFlight, not to
          # a cable. App Store distribution profiles carry no device list at all,
          # so the export step can mint one from the API key with nothing else
          # set up. Doing it in that order is what removes the need for a Mac.
          #
          # CURRENT_PROJECT_VERSION is overridden rather than committed: every
          # upload needs a build number App Store Connect has not seen, and a
          # duplicate is only rejected after the whole archive has been built.
          # The run number is monotonic, so it cannot collide with itself.
          xcodebuild archive \
            -project Meow.xcodeproj \
            -scheme Meow \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Meow.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > "$RUNNER_TEMP/archive.log" 2>&1 || {
              echo "::group::archive errors"
              grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -40
              echo "::endgroup::"
              exit 1; }
          echo "archived build ${{ github.run_number }}"

      - name: Install the signing identity
        run: |
          # Automatic signing asks Apple's cloud signing service to produce an
          # identity, and this key is not permitted to use it — that is the
          # "Cloud signing permission error", and the "no profiles were found"
          # that follows is a symptom of it rather than a second problem. So the
          # identity is supplied directly and signing is done manually.
          . ci/credentials.env
          KC="$RUNNER_TEMP/build.keychain"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$ASC_P12_FILE" -k "$KC" -P "$ASC_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this the private key prompts for permission, which on a
          # headless runner simply hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          echo "identities available to codesign:"
          security find-identity -v -p codesigning "$KC"

          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          cp "$ASC_PROFILE_FILE" "$PROFILES/meowroom.mobileprovision"

      - name: Export and upload
        run: |
          set -o pipefail
          . ci/credentials.env
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo "<key>method</key><string>app-store-connect</string>"
            echo "<key>destination</key><string>upload</string>"
            echo "<key>teamID</key><string>$TEAM_ID</string>"
            echo "<key>uploadSymbols</key><true/>"
            echo "<key>signingStyle</key><string>manual</string>"
            echo "<key>signingCertificate</key><string>$ASC_SIGNING_IDENTITY</string>"
            echo "<key>provisioningProfiles</key><dict>"
            echo "  <key>com.drinkmellis.meowroom</key><string>$ASC_PROFILE_NAME</string>"
            echo "</dict>"
            echo '</dict></plist>'
          } > "$RUNNER_TEMP/ExportOptions.plist"

          # No -allowProvisioningUpdates: everything it would go and fetch is
          # already here, and asking for it puts cloud signing back in the path.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Meow.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || {
              echo "::group::export errors"
              grep -E "error:|Error Domain" "$RUNNER_TEMP/export.log" | sort -u | head -40
              echo "::endgroup::"
              exit 1; }
          echo "uploaded to App Store Connect; processing takes 5-15 minutes"

      - name: Clean up the key
        if: always()
        run: rm -rf ~/private_keys

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
