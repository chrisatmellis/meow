name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled — macOS minutes are not free.
concurrency:
  group: verify-${{ github.ref }}
  # Deliberately not cancel-in-progress. That is the right setting for a linter,
  # where only the newest answer matters, but this workflow's screenshots are the
  # only way to see the app without a Mac — they are the output, not a status
  # light. Cancelling meant every follow-up push threw away the render someone
  # was waiting on. Queue instead: a little more runner time, but each push
  # actually produces the pictures it was pushed to produce.
  cancel-in-progress: false

jobs:
  engine:
    name: engine (headless)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install python
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 --no-install-recommends

      - name: Assertions
        run: ./Tools/linux-verify/verify.sh

      - name: Behavioural profile
        run: ./Tools/linux-verify/verify.sh --profile

  app:
    name: app (Xcode)
    runs-on: macos-latest
    permissions:
      contents: write        # to publish the screenshots to their own branch
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i ios || true

      - name: Build for simulator
        run: ./Tools/xcode-build.sh

      - name: Keep the full log
        if: always()
        run: cp "${TMPDIR:-/tmp}/meow-build.log" ./meow-build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: meow-build.log
          if-no-files-found: ignore

      - name: Run in a simulator and screenshot
        run: ./Tools/xcode-screenshot.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Publish screenshots to their own branch
        if: success()
        run: |
          # Artifacts can only be fetched through api.github.com, and not every
          # environment that needs to look at these can reach it — including the
          # one where most of the rendering work actually gets done, which spent a
          # whole session guessing at lighting and materials for exactly this
          # reason. A branch is reachable: raw.githubusercontent.com serves it
          # directly, and any tool that can read a URL can read a screenshot.
          #
          # Orphan and force-pushed, so it never accumulates history, never grows
          # the clone for anyone who does not want it, and cannot touch the source
          # branch it was built from.
          ls screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots to publish"; exit 0; }

          STAGE="$RUNNER_TEMP/shots"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp screenshots/*.png "$STAGE/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan screenshots-publish
          git rm -rqf --cached .
          rm -rf screenshots
          mkdir screenshots
          cp "$STAGE"/*.png screenshots/

          {
            echo "# Screenshots"
            echo
            echo "Generated by the \`verify\` workflow. This branch is force-pushed"
            echo "on every run and has no history — do not commit to it."
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- taken:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for f in screenshots/*.png; do echo "- \`$f\`"; done
          } > README.md

          # -f because screenshots/ is in .gitignore, which is correct for the
          # source branch and exactly wrong for the branch whose entire purpose is
          # to carry them.
          git add -f screenshots README.md
          git commit -q -m "screenshots from ${GITHUB_SHA:0:7}"
          git push -qf origin screenshots-publish:screenshots
          echo "published to the screenshots branch"
