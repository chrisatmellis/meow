name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled — macOS minutes are not free.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (headless)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install python
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 --no-install-recommends

      - name: Assertions
        run: ./Tools/linux-verify/verify.sh

      - name: Behavioural profile
        run: ./Tools/linux-verify/verify.sh --profile

  app:
    name: app (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i ios || true

      - name: Build for simulator
        run: ./Tools/xcode-build.sh

      - name: Keep the full log
        if: always()
        run: cp "${TMPDIR:-/tmp}/meow-build.log" ./meow-build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: meow-build.log
          if-no-files-found: ignore
