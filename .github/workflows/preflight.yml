name: preflight

# Checks the App Store Connect setup in about ten seconds, on a free runner,
# before anything slow depends on it. Run this first after adding the secrets:
# every problem it catches would otherwise appear twenty minutes into an archive
# on a macOS runner, as a signing or upload error that names none of the pieces.
on:
  workflow_dispatch:

jobs:
  check:
    name: check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check App Store Connect setup
        env:
          S_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          S_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Repository secrets win where they exist; ci/ is the fallback. Moving
          # to secrets later is then just setting them — see ci/README.md.
          . ci/credentials.env
          KEY_ID="${S_KEY_ID:-$ASC_KEY_ID}"
          ISSUER_ID="${S_ISSUER_ID:-$ASC_ISSUER_ID}"
          TEAM_ID="${S_TEAM_ID:-$ASC_TEAM_ID}"
          if [ -n "$S_KEY_P8" ]; then
            printf '%s\n' "$S_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
            echo "using repository secrets"
          else
            KEY_FILE="$ASC_KEY_FILE"
            echo "using committed credentials in ci/"
          fi

          python3 Tools/asc-preflight.py \
            --key "$KEY_FILE" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --team "$TEAM_ID" \
            --bundle com.drinkmellis.meowroom

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
