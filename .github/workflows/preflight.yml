name: preflight

# Checks the App Store Connect setup in about ten seconds, on a free runner,
# before anything slow depends on it. Run this first after setting the secrets:
# every problem it catches would otherwise appear twenty minutes into an archive
# on a macOS runner, as a signing or upload error that names none of the pieces.
on:
  workflow_dispatch:

env:
  TEAM_ID: KJ9NJ2M7C6
  BUNDLE_ID: com.drinkmellis.meowroom

jobs:
  check:
    name: check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check the signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "  ✗ APPLE_SIGNING_P12_BASE64 is not set"; exit 1; }
          [ -n "$P12_PASSWORD" ] || { echo "  ✗ APPLE_SIGNING_P12_PASSWORD is not set"; exit 1; }
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12" 2>/dev/null \
            || { echo "  ✗ APPLE_SIGNING_P12_BASE64 is not valid base64 — check it pasted whole"; exit 1; }

          # macOS security(1) cannot read a PKCS#12 in OpenSSL 3 defaults
          # (AES-256/SHA-256) and reports it as "MAC verification failed ...
          # (wrong password?)", which sends you looking at the password instead of
          # the encoding. It needs the legacy SHA-1/3DES form. This check exists
          # because that misdiagnosis cost a macOS run once already.
          mac=$(openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin pass:"$P12_PASSWORD" \
                  -info -noout -legacy 2>&1 | grep -i "^MAC:" | head -1)
          echo "  · p12 $mac"
          case "$mac" in
            *sha1*) echo "  ✓ p12 is in the legacy encoding macOS can import" ;;
            "") echo "  ✗ could not open the p12 — the password is probably wrong"; exit 1 ;;
            *) echo "  ✗ p12 uses a MAC macOS cannot import; regenerate with Tools/asc-rotate.py"
               exit 1 ;;
          esac

          # And that the certificate inside is one Apple still trusts. A revoked
          # certificate signs perfectly well locally and is rejected at upload.
          expiry=$(openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin pass:"$P12_PASSWORD" \
                     -nokeys -legacy 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          echo "  ✓ certificate expires $expiry"

      - name: Check App Store Connect setup
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          printf '%s\n' "$APP_STORE_CONNECT_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 Tools/asc-preflight.py \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --team "$TEAM_ID" \
            --bundle "$BUNDLE_ID"

          echo ""
          echo "  · next build number will be $(($(python3 Tools/asc-preflight.py latest-build) + 1))"
          echo "  · provisioning profile: $(python3 Tools/asc-rotate.py profile "$RUNNER_TEMP/p.mobileprovision")"

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/p.mobileprovision"
